<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grandmaster Digital Hub | Learn, Build, Grow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- GRANDMASTER AI FLOATING BOX -->
    <div
      id="gm-box"
      style="
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 999999;
        font-family: Outfit, sans-serif;
      "
    >
      <div
        id="gm-chat"
        style="
          display: none;
          width: 360px;
          height: 480px;
          background: #111;
          border: 2px solid #ffd700;
          border-radius: 16px;
          margin-bottom: 12px;
          overflow: hidden;
          flex-direction: column;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        "
      >
        <div
          style="
            background: #ffd700;
            color: #000;
            padding: 12px 15px;
            font-weight: 900;
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <span>👑 Grandmaster AI Brain</span
          ><span id="gm-close" style="cursor: pointer; font-size: 18px">✖</span>
        </div>
        <div
          id="gm-msgs"
          style="
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            color: #fff;
            font-size: 14px;
            line-height: 1.5;
          "
        >
          <div
            style="
              color: #888;
              background: #1a1a1a;
              padding: 10px;
              border-radius: 10px;
            "
          >
            Salam General! 👋 I am Grandmaster AI. How can I help you today?
          </div>
        </div>
        <div
          style="
            display: flex;
            padding: 10px;
            background: #0a0a0a;
            border-top: 1px solid #222;
          "
        >
          <input
            id="gm-input"
            style="
              flex: 1;
              background: #222;
              border: 1px solid #333;
              color: #fff;
              padding: 12px;
              border-radius: 10px;
              outline: none;
            "
            placeholder="Ask anything..."
          /><button
            id="gm-send"
            style="
              background: #ffd700;
              color: #000;
              border: none;
              padding: 12px 18px;
              margin-left: 8px;
              border-radius: 10px;
              font-weight: 900;
              cursor: pointer;
            "
          >
            Send
          </button>
        </div>
      </div>
      <button
        id="gm-btn"
        style="
          background: #ffd700;
          color: #000;
          border: none;
          padding: 14px 24px;
          border-radius: 50px;
          font-weight: 900;
          font-size: 14px;
          cursor: pointer;
          box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
          float: right;
        "
      >
        🤖 GRANDMASTER AI
      </button>
    </div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      const gbtn = document.getElementById("gm-btn"),
        gchat = document.getElementById("gm-chat"),
        gclose = document.getElementById("gm-close"),
        ginput = document.getElementById("gm-input"),
        gsend = document.getElementById("gm-send"),
        gmsgs = document.getElementById("gm-msgs");
      gbtn.onclick = () => {
        gchat.style.display = gchat.style.display === "flex" ? "none" : "flex";
      };
      gclose.onclick = () => (gchat.style.display = "none");
      async function gsendMsg() {
        let t = ginput.value.trim();
        if (!t) return;
        gmsgs.innerHTML += `<div style="text-align:right;margin:10px 0"><span style="background:#FFD700;color:#000;padding:8px 14px;border-radius:14px 14px 2px 14px;display:inline-block;max-width:80%">${t}</span></div>`;
        ginput.value = "";
        gmsgs.scrollTop = gmsgs.scrollHeight;
        let d = document.createElement("div");
        d.id = "typing";
        d.style.color = "#FFD700";
        d.style.margin = "10px 0";
        d.textContent = "⚡ Thinking...";
        gmsgs.appendChild(d);
        try {
          let r = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: t }),
          });
          let j = await r.json();
          document.getElementById("typing")?.remove();
          gmsgs.innerHTML += `<div style="margin:10px 0"><span style="background:#222;border:1px solid #333;padding:8px 14px;border-radius:14px 14px 2px;display:inline-block;max-width:80%">${j.reply || j.error || "No reply from brain"}</span></div>`;
        } catch (e) {
          document.getElementById("typing")?.remove();
          gmsgs.innerHTML += `<div style="color:#ff4444;margin:10px 0">Error: ${e.message}</div>`;
        }
        gmsgs.scrollTop = gmsgs.scrollHeight;
      }
      gsend.onclick = gsendMsg;
      ginput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") gsendMsg();
      });
    </script>
  </body>
</html>
